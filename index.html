<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  <meta name="description" content="코웨이 홈케어 닥터 업무 도구 시작 화면">
  <title>COWAY 홈케어</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --blue: #3182f6;
      --blue-deep: #1b64da;
      --blue-soft: #e8f3ff;
      --ink: #191f28;
      --gray-700: #4e5968;
      --gray-600: #6b7684;
      --gray-500: #8b95a1;
      --gray-300: #d1d6db;
      --gray-200: #e5e8eb;
      --gray-100: #f2f4f6;
      --surface: #ffffff;
      --danger: #e42939;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--gray-100);
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--gray-100);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .start-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      background:
        radial-gradient(circle at 92% 24%, rgba(49, 130, 246, 0.09) 0, rgba(49, 130, 246, 0.09) 92px, transparent 93px),
        var(--gray-100);
    }

    .brand-header {
      height: calc(60px + env(safe-area-inset-top));
      display: flex;
      align-items: flex-end;
      padding: env(safe-area-inset-top) 22px 15px;
    }

    .brand-logo {
      width: 96px;
      max-height: 27px;
      display: block;
      object-fit: contain;
      object-position: left center;
    }

    .brand-fallback {
      display: none;
      color: #42a5dc;
      font-size: 1.7rem;
      font-weight: 850;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .start-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(50px, 9vh, 82px) 24px calc(24px + env(safe-area-inset-bottom));
    }

    .audience-badge {
      width: fit-content;
      margin: 0 0 17px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-deep);
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .start-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2rem, 9vw, 2.55rem);
      font-weight: 900;
      letter-spacing: -0.065em;
      line-height: 1.18;
      word-break: keep-all;
    }

    .start-description {
      max-width: 330px;
      margin: 16px 0 0;
      color: var(--gray-600);
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.55;
      word-break: keep-all;
    }

    .start-form { margin-top: 42px; }

    .field-label {
      display: block;
      margin: 0 4px 10px;
      color: var(--gray-700);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .employee-input {
      width: 100%;
      height: 62px;
      padding: 0 18px;
      border: 0;
      border-radius: 18px;
      outline: 3px solid transparent;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 6px 22px rgba(15, 23, 42, 0.05);
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      transition: outline-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .employee-input::placeholder { color: var(--gray-300); font-weight: 700; letter-spacing: -0.02em; }

    .employee-input:focus {
      outline-color: rgba(49, 130, 246, 0.28);
      box-shadow: 0 8px 26px rgba(49, 130, 246, 0.10);
    }

    .employee-input[aria-invalid="true"] { outline-color: rgba(228, 41, 57, 0.30); }

    .field-error {
      min-height: 24px;
      margin: 8px 4px 0;
      color: var(--danger);
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(-3px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .field-error.show { opacity: 1; transform: translateY(0); }

    .start-button {
      width: 100%;
      min-height: 58px;
      margin-top: 8px;
      padding: 15px 20px;
      border: 0;
      border-radius: 18px;
      background: var(--blue);
      color: #ffffff;
      box-shadow: 0 9px 24px rgba(49, 130, 246, 0.22);
      font-size: 1rem;
      font-weight: 850;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .start-button:active { transform: scale(0.975); background: var(--blue-deep); box-shadow: 0 5px 16px rgba(49, 130, 246, 0.18); }

    .biometric-button {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 18px;
      background: var(--surface);
      color: var(--blue-deep);
      box-shadow: 0 6px 22px rgba(15, 23, 42, 0.055);
      font-size: 0.96rem;
      font-weight: 850;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .biometric-button[hidden] { display: none; }
    .biometric-button:active { transform: scale(0.975); background: var(--blue-soft); }
    .biometric-button:disabled { cursor: wait; opacity: 0.76; }
    .biometric-button.is-success { background: #e8f8f1; color: #008f63; }

    .biometric-icon {
      width: 34px;
      height: 34px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 11px;
      background: var(--blue-soft);
    }

    .biometric-icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
    }

    .biometric-button.is-busy .biometric-icon { animation: biometricPulse 950ms ease-in-out infinite; }

    .biometric-status {
      min-height: 20px;
      margin: 8px 4px 0;
      color: var(--gray-500);
      font-size: 0.72rem;
      font-weight: 650;
      line-height: 1.45;
      text-align: center;
    }

    .biometric-status[hidden] { display: none; }

    @keyframes biometricPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.62; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    .start-button:focus-visible,
    .biometric-button:focus-visible,
    .employee-input:focus-visible { outline: 3px solid rgba(49, 130, 246, 0.35); outline-offset: 2px; }

    .privacy-note {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 14px 4px 0;
      color: var(--gray-500);
      font-size: 0.76rem;
      font-weight: 650;
      line-height: 1.45;
    }

    .privacy-mark {
      width: 16px;
      height: 16px;
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      border: 1.5px solid var(--gray-500);
      border-radius: 50%;
      font-size: 0.66rem;
      font-weight: 900;
      line-height: 1;
    }

    .start-footer {
      margin-top: auto;
      padding-top: 48px;
      color: var(--gray-500);
      font-size: 0.76rem;
      font-weight: 650;
      line-height: 1.5;
    }

    @media (max-height: 650px) {
      .start-main { padding-top: 28px; }
      .start-form { margin-top: 28px; }
      .start-footer { padding-top: 26px; }
    }

    @media (max-width: 359px) {
      .brand-header { padding-right: 18px; padding-left: 18px; }
      .start-main { padding-right: 20px; padding-left: 20px; }
      .start-title { font-size: 1.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="start-shell">
    <header class="brand-header">
      <img
        src="logo.png"
        alt="COWAY"
        class="brand-logo"
        onerror="this.style.display='none';document.getElementById('brandFallback').style.display='inline-block';"
      >
      <span id="brandFallback" class="brand-fallback" aria-hidden="true">coway</span>
    </header>

    <main class="start-main">
      <div>
        <p class="audience-badge">홈케어 닥터 전용</p>
        <h1 class="start-title">오늘의 상담을<br>시작해볼까요?</h1>
        <p class="start-description">사원번호를 입력하면 업무 도구로 바로 이동해요.</p>
      </div>

      <form class="start-form" id="startForm" novalidate>
        <label class="field-label" for="empId">사원번호</label>
        <input
          class="employee-input"
          type="text"
          id="empId"
          name="employeeId"
          placeholder="사원번호 입력"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="12"
          autocomplete="off"
          aria-describedby="fieldError"
        >
        <p class="field-error" id="fieldError" role="alert">사원번호를 입력해 주세요.</p>
        <button class="start-button" id="startButton" type="submit">시작하기</button>
        <button class="biometric-button" id="biometricButton" type="button" hidden>
          <span class="biometric-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6.2 9.4A5.9 5.9 0 0 1 12 4.7a5.9 5.9 0 0 1 5.8 4.7"/>
              <path d="M4.4 8.2A8 8 0 0 1 12 2.8a8 8 0 0 1 7.6 5.4"/>
              <path d="M8.1 10.4A4 4 0 0 1 12 7.2a4 4 0 0 1 3.9 3.2"/>
              <path d="M7.1 13.1c.2 2.8-1 4.8-2.1 6"/>
              <path d="M10 11.2c0 5.1-.9 7.3-2.2 9.1"/>
              <path d="M13.9 11.2c0 5-.4 7.9-1.5 10"/>
              <path d="M16.9 12.1c.1 3.7-.1 6.2-.8 8.2"/>
              <path d="M19.5 11.2c.2 2.8.1 4.9-.2 6.6"/>
            </svg>
          </span>
          <span id="biometricLabel">지문 빠른 시작 등록</span>
        </button>
        <p class="biometric-status" id="biometricStatus" role="status" aria-live="polite" hidden></p>
      </form>

      <p class="privacy-note">
        <span class="privacy-mark" aria-hidden="true">i</span>
        사원번호는 저장되지 않고, 빠른 시작 연결 정보만 이 브라우저에 보관돼요.
      </p>

      <footer class="start-footer">COWAY 홈케어 업무 도구</footer>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("startForm");
      const input = document.getElementById("empId");
      const error = document.getElementById("fieldError");
      const button = document.getElementById("startButton");
      const biometricButton = document.getElementById("biometricButton");
      const biometricLabel = document.getElementById("biometricLabel");
      const biometricStatus = document.getElementById("biometricStatus");
      const BIOMETRIC_KEY = "coway-homecare-quick-start-v1";

      let savedCredentialId = readCredentialId();

      function readCredentialId() {
        try {
          return localStorage.getItem(BIOMETRIC_KEY) || "";
        } catch (_) {
          return "";
        }
      }

      function saveCredentialId(value) {
        try {
          localStorage.setItem(BIOMETRIC_KEY, value);
          return true;
        } catch (_) {
          return false;
        }
      }

      function randomBytes(length = 32) {
        return crypto.getRandomValues(new Uint8Array(length));
      }

      function toBase64Url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        bytes.forEach(byte => { binary += String.fromCharCode(byte); });
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function fromBase64Url(value) {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        const binary = atob(padded);
        return Uint8Array.from(binary, character => character.charCodeAt(0));
      }

      function updateBiometricCopy() {
        biometricLabel.textContent = savedCredentialId ? "지문으로 빠른 시작" : "지문 빠른 시작 등록";
        biometricStatus.textContent = savedCredentialId
          ? "등록한 기기의 지문·얼굴·화면 잠금으로 시작해요."
          : "사원번호 입력 후 등록하면 다음부터 바로 시작할 수 있어요.";
      }

      function setBiometricBusy(isBusy, label = "") {
        biometricButton.disabled = isBusy;
        biometricButton.classList.toggle("is-busy", isBusy);
        if (label) biometricLabel.textContent = label;
      }

      function showBiometricMessage(message) {
        biometricStatus.hidden = false;
        biometricStatus.textContent = message;
      }

      function enterMain() {
        window.location.href = "main.html";
      }

      function clearError() {
        input.removeAttribute("aria-invalid");
        error.classList.remove("show");
      }

      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "");
        if (input.value) clearError();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const employeeId = input.value.trim();

        if (!employeeId) {
          input.setAttribute("aria-invalid", "true");
          error.classList.add("show");
          input.focus();
          return;
        }

        clearError();
        button.disabled = true;
        button.textContent = "들어가는 중...";
        enterMain();
      });

      biometricButton.addEventListener("click", async () => {
        if (!savedCredentialId && !input.value.trim()) {
          input.setAttribute("aria-invalid", "true");
          error.classList.add("show");
          input.focus();
          showBiometricMessage("처음 한 번만 사원번호를 입력해 주세요.");
          return;
        }

        clearError();
        biometricButton.classList.remove("is-success");
        setBiometricBusy(true, savedCredentialId ? "지문 확인 중..." : "빠른 시작 등록 중...");
        showBiometricMessage("휴대폰에 표시되는 인증창을 확인해 주세요.");

        try {
          let credential;

          if (savedCredentialId) {
            credential = await navigator.credentials.get({
              publicKey: {
                challenge: randomBytes(),
                allowCredentials: [{
                  id: fromBase64Url(savedCredentialId),
                  type: "public-key",
                  transports: ["internal"]
                }],
                userVerification: "required",
                timeout: 60000
              }
            });
          } else {
            credential = await navigator.credentials.create({
              publicKey: {
                challenge: randomBytes(),
                rp: { name: "COWAY 홈케어" },
                user: {
                  id: randomBytes(),
                  name: `homecare-doctor-${Date.now()}`,
                  displayName: "홈케어 닥터"
                },
                pubKeyCredParams: [
                  { type: "public-key", alg: -7 },
                  { type: "public-key", alg: -257 }
                ],
                authenticatorSelection: {
                  authenticatorAttachment: "platform",
                  residentKey: "preferred",
                  userVerification: "required"
                },
                attestation: "none",
                timeout: 60000
              }
            });

            if (credential) {
              const encodedCredentialId = toBase64Url(credential.rawId);
              if (saveCredentialId(encodedCredentialId)) savedCredentialId = encodedCredentialId;
            }
          }

          if (!credential) throw new Error("인증 결과가 없습니다.");

          biometricButton.classList.add("is-success");
          setBiometricBusy(false, "확인됐어요");
          showBiometricMessage("빠른 시작 완료! 업무 도구로 이동해요.");
          if (navigator.vibrate) navigator.vibrate(35);
          window.setTimeout(enterMain, 420);
        } catch (authError) {
          setBiometricBusy(false);
          updateBiometricCopy();

          if (authError && authError.name === "NotAllowedError") {
            showBiometricMessage("인증이 취소됐어요. 다시 누르거나 사원번호로 시작해 주세요.");
          } else {
            showBiometricMessage("이 브라우저에서는 빠른 시작을 사용할 수 없어요. 사원번호로 시작해 주세요.");
          }
        }
      });

      async function initializeBiometric() {
        if (!window.isSecureContext || !window.PublicKeyCredential || !navigator.credentials) return;

        try {
          const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (!available) return;

          updateBiometricCopy();
          biometricButton.hidden = false;
          biometricStatus.hidden = false;
        } catch (_) {
          biometricButton.hidden = true;
          biometricStatus.hidden = true;
        }
      }

      initializeBiometric();
    })();
  </script>
</body>
</html>
