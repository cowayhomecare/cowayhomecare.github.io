<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COWAY 세일즈 웨폰</title>
  <style>
    body { background-color: #f2f4f6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 40px 24px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); width: 85%; max-width: 320px; }
    .logo-wrap { text-align: center; margin-bottom: 30px; }
    .logo-title { font-size: 24px; font-weight: 900; color: #191f28; margin-bottom: 6px; letter-spacing: -0.5px; }
    .logo-sub { font-size: 14px; color: #8b95a1; font-weight: 500; }
    .input-title { font-size: 13px; color: #4e5968; font-weight: 700; margin-bottom: 8px; display: block; }
    
    input { width: 100%; padding: 16px; border: none; background-color: #f2f4f6; border-radius: 12px; font-size: 18px; font-weight: 700; color: #333; box-sizing: border-box; margin-bottom: 30px; text-align: center; outline: none; transition: 0.2s; }
    input:focus { background-color: #e5e8eb; }
    
    button { width: 100%; padding: 18px; background-color: #005bb5; color: white; border: none; border-radius: 16px; font-size: 17px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.96); background-color: #004c99; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo-wrap">
      <div class="logo-title">COWAY HOMECARE</div>
      <div class="logo-sub">지국 닥터 전용 세일즈 웨폰</div>
    </div>
    <label class="input-title">사원번호</label>
    <input type="number" id="empId" placeholder="사번 입력" inputmode="numeric">
    <button onclick="attemptLogin()">시작하기</button>
  </div>
  <script>
    function attemptLogin() {
      const empId = document.getElementById('empId').value;
      if(empId.length >= 1) window.location.href = "main.html";
      else alert("사번을 입력해주세요!");
    }
  </script>
</body>
</html>
