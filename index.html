<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코웨이 홈케어 영업 무기</title>
  <style>
    body { background-color: #f4f7fa; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 40px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 86, 179, 0.1); width: 80%; max-width: 350px; text-align: center; }
    .logo { font-size: 26px; font-weight: 900; color: #005bb5; letter-spacing: -1px; margin-bottom: 5px; }
    .sub-text { font-size: 14px; color: #666; margin-bottom: 35px; font-weight: 600; }
    input { width: 100%; padding: 16px; border: 2px solid #e4e7ec; border-radius: 14px; font-size: 16px; font-weight: bold; box-sizing: border-box; margin-bottom: 20px; outline: none; transition: 0.3s; text-align: center; }
    input:focus { border-color: #005bb5; }
    button { width: 100%; padding: 16px; background-color: #005bb5; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.96); background-color: #004488; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">COWAY HOMECARE</div>
    <div class="sub-text">지국 닥터 전용 세일즈 웨폰</div>
    <input type="number" id="empId" placeholder="사번을 입력하세요" inputmode="numeric">
    <button onclick="attemptLogin()">접속하기</button>
  </div>

  <script>
    function attemptLogin() {
      const empId = document.getElementById('empId').value;
      // 형님 요청: 1자리 이상 치면 무조건 통과!
      if(empId.length >= 1) {
        window.location.href = "main.html";
      } else {
        alert("사번을 1자리 이상 입력해 주세요!");
      }
    }
  </script>

</body>
</html>
