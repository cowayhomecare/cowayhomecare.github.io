<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코웨이 홈케어 갤러리</title>
  <style>
    body { background-color: #f4f7fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding-bottom: 80px; }
    .header { background: #0b63ce; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: 900; }
    
    /* 상단 스와이프 필터 버튼 */
    .filter-bar { display: flex; gap: 8px; padding: 15px; overflow-x: auto; background: white; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1.5px solid #e4e7ec; background: #fff; font-size: 14px; font-weight: 700; color: #666; cursor: pointer; }
    .filter-btn.active { background: #0b63ce; color: white; border-color: #0b63ce; }
    .filter-bar::-webkit-scrollbar { display: none; }

    /* 갤러리 2열 그리드 (글자판 아예 없애고 사진만 꽉 채움) */
    .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
    .photo-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .photo-card img { width: 100%; height: 180px; object-fit: cover; display: block; }

    /* 하단 메뉴바 */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); border-top-left-radius: 15px; border-top-right-radius: 15px;}
    .nav-item { text-align: center; color: #adb5bd; font-size: 13px; font-weight: 800; text-decoration: none; }
    .nav-item.active { color: #0b63ce; }
  </style>
</head>
<body>

  <!-- 상단 간판 누르면 홈으로 이동 -->
  <a href="main.html" style="text-decoration: none;">
    <div class="header">현장 시공 갤러리</div>
  </a>

  <!-- 분류 탭 버튼 -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterPhotos('all')">전체보기</button>
    <button class="filter-btn" onclick="filterPhotos('pade')">🛠️ 파운데이션</button>
    <button class="filter-btn" onclick="filterPhotos('saje')">✨ 사제헤드 호환</button>
    <button class="filter-btn" onclick="filterPhotos('etep')">⚙️ 이텝(E-TEP)</button>
  </div>

  <!-- 사진 목록 (오직 사진만 깔끔하게 출력) -->
  <div class="gallery-grid" id="galleryContainer">
    
    <!-- 파운데이션 사진 6장 -->
    <div class="photo-card" data-category="pade"><img src="pade1.jpg"></div>
    <div class="photo-card" data-category="pade"><img src="pade2.jpg"></div>
    <div class="photo-card" data-category="pade"><img src="pade3.jpg"></div>
    <div class="photo-card" data-category="pade"><img src="pade4.jpg"></div>
    <div class="photo-card" data-category="pade"><img src="pade5.jpg"></div>
    <div class="photo-card" data-category="pade"><img src="pade6.jpg"></div>

    <!-- 사제헤드 사진 5장 -->
    <div class="photo-card" data-category="saje"><img src="saje1.jpg"></div>
    <div class="photo-card" data-category="saje"><img src="saje2.jpg"></div>
    <div class="photo-card" data-category="saje"><img src="saje3.jpg"></div>
    <div class="photo-card" data-category="saje"><img src="saje4.jpg"></div>
    <div class="photo-card" data-category="saje"><img src="saje5.jpg"></div>

  </div>

  <!-- 하단 고정 메뉴바 -->
  <div class="bottom-nav">
    <a href="main.html" class="nav-item">홈(메인)</a>
    <a href="calc.html" class="nav-item">계산기</a>
    <a href="gallery.html" class="nav-item active">갤러리</a>
    <a href="#" class="nav-item">프로모션</a>
  </div>

  <script>
    function filterPhotos(category) {
      let buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      let cards = document.querySelectorAll('.photo-card');
      cards.forEach(card => {
        if (category === 'all' || card.getAttribute('data-category') === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
