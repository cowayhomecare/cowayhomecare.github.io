<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COWAY 세일즈 웨폰</title>
  <style>
    /* 기본 배경 및 폰트 (은은하고 깔끔한 감성) */
    body {
      background-color: #f7f9fa; 
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 상단 로고 배너 (화이트 & 부드러운 섀도우) */
    .header-banner {
      background-color: #ffffff;
      padding: 20px 20px 24px 20px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
      margin-bottom: 24px;
    }
    .header-banner img {
      height: 32px;
      object-fit: contain;
    }

    /* 6칸 대시보드 그리드 (큼직한 2열 + 넓은 여백) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 16px;
      padding: 0 20px 40px 20px;
    }

    /* 메뉴 카드 스타일 (형님이 원하신 깊은 라운딩과 여백) */
    .menu-card {
      background-color: #ffffff;
      border-radius: 28px; 
      aspect-ratio: 1 / 1; /* 완벽한 정사각형 비율 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.02);
      transition: transform 0.1s ease;
    }
    .menu-card:active {
      transform: scale(0.95);
      background-color: #f0f4f8;
    }

    /* 아이콘 및 글씨 스타일 */
    .menu-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .menu-title {
      font-size: 15px;
      font-weight: 800;
      color: #333333;
      letter-spacing: -0.3px;
    }
    .menu-desc {
      font-size: 11px;
      font-weight: 600;
      color: #888888;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- 상단 배너 (로고 클릭 시 홈으로 새로고침) -->
  <a href="main.html" style="text-decoration: none; display: block;">
    <div class="header-banner">
      <!-- 깃허브에 올리신 로고 파일명(logo.png) 매칭 -->
      <img src="logo.png" alt="COWAY 로고" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div style="display:none; font-size:22px; font-weight:900; color:#005bb5;">COWAY</div>
    </div>
  </a>

  <!-- 6칸 대시보드 메뉴 -->
  <div class="dashboard-grid">
    
    <!-- 1. 렌탈료 계산기 -->
    <a href="calc.html" class="menu-card">
      <div class="menu-icon">🧮</div>
      <div class="menu-title">렌탈료 계산기</div>
      <div class="menu-desc">실시간 단가 확인</div>
    </a>

    <!-- 2. B&A 갤러리 -->
    <a href="gallery.html" class="menu-card">
      <div class="menu-icon">🖼️</div>
      <div class="menu-title">시공 갤러리</div>
      <div class="menu-desc">현장 비포&애프터</div>
    </a>

    <!-- 3. 공포 마케팅 뷰어 -->
    <a href="weather.html" class="menu-card">
      <div class="menu-icon">🚨</div>
      <div class="menu-title">우리동네 공기</div>
      <div class="menu-desc">날씨·미세먼지 연동</div>
    </a>

    <!-- 4. 안심 케어 리포트 -->
    <a href="#" class="menu-card">
      <div class="menu-icon">📝</div>
      <div class="menu-title">케어 리포트</div>
      <div class="menu-desc">카톡 전송용 생성기</div>
    </a>

    <!-- 5. 팩트 폭격 비교표 -->
    <a href="#" class="menu-card">
      <div class="menu-icon">🥊</div>
      <div class="menu-title">타사 비교표</div>
      <div class="menu-desc">숨겨진 유지비 팩폭</div>
    </a>

    <!-- 6. 이달의 프로모션 -->
    <a href="#" class="menu-card">
      <div class="menu-icon">🎁</div>
      <div class="menu-title">이달의 혜택</div>
      <div class="menu-desc">실시간 프로모션</div>
    </a>

  </div>

</body>
</html>
