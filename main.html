<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  <meta name="description" content="코웨이 제품과 혜택을 빠르게 확인하는 홈케어 도구">
  <title>COWAY 홈케어</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="app-nav.css">
  <script src="ui-config.js"></script>
</head>

<body data-app-page="home">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" data-route="home" href="main.html" aria-label="홈으로 이동">
        <img id="brandLogo" src="logo.png" alt="COWAY">
        <span id="brandFallback" class="brand-word" aria-hidden="true">coway</span>
      </a>
    </header>

    <main class="main-content">
      <a class="shopping-hero" data-route="products" href="calc.html">
        <div class="hero-copy">
          <span class="hero-label" data-copy="heroLabel">제품 둘러보기</span>
          <h1 class="hero-title" data-copy="heroTitle">고객님께 맞는 제품을
한눈에 찾아보세요</h1>
          <p class="hero-description" data-copy="heroDescription">제품과 월 렌탈료를 바로 확인할 수 있어요.</p>
        </div>

        <div class="hero-bottom">
          <span class="hero-action">
            <span data-copy="heroAction">제품 보러가기</span>
            <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
          </span>
          <span class="hero-icon" aria-hidden="true">
            <span class="material-symbols-rounded">shopping_bag</span>
          </span>
        </div>
      </a>

      <section class="shortcut-section" aria-labelledby="shortcutTitle">
        <h2 id="shortcutTitle" class="section-heading" data-copy="shortcutTitle">바로가기</h2>

        <div class="shortcut-grid">
          <a class="shortcut-card wide" data-route="benefits" href="benefit.html">
            <div class="shortcut-copy">
              <h3 class="shortcut-title" data-copy="benefitTitle">이번 달 혜택</h3>
              <p class="shortcut-description" data-copy="benefitDescription">프로모션과 제휴카드 할인</p>
            </div>
            <span class="shortcut-icon orange" aria-hidden="true">
              <span class="material-symbols-rounded">redeem</span>
            </span>
          </a>

          <a class="shortcut-card" data-route="report" href="weather.html">
            <span class="shortcut-icon violet" aria-hidden="true">
              <span class="material-symbols-rounded">air</span>
            </span>
            <div class="shortcut-copy">
              <h3 class="shortcut-title" data-copy="reportTitle">안심 리포트</h3>
              <p class="shortcut-description" data-copy="reportDescription">미세먼지와 실내 습도</p>
            </div>
          </a>

          <a class="shortcut-card" data-route="gallery" href="gallery.html">
            <span class="shortcut-icon green" aria-hidden="true">
              <span class="material-symbols-rounded">photo_library</span>
            </span>
            <div class="shortcut-copy">
              <h3 class="shortcut-title" data-copy="galleryTitle">갤러리</h3>
              <p class="shortcut-description" data-copy="galleryDescription">제품과 설치 사례</p>
            </div>
          </a>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const config = window.COWAY_UI_CONFIG || {};
      const copy = config.copy || {};
      const routes = config.routes || {};

      const title = copy.pageTitle || "COWAY 홈케어";
      document.title = title;

      document.querySelectorAll("[data-copy]").forEach((element) => {
        const key = element.dataset.copy;
        if (typeof copy[key] === "string" && copy[key].trim()) {
          element.textContent = copy[key];
        }
      });

      document.querySelectorAll("[data-route]").forEach((element) => {
        const key = element.dataset.route;
        if (typeof routes[key] === "string" && routes[key].trim()) {
          element.setAttribute("href", routes[key]);
        }
      });

      const logo = document.getElementById("brandLogo");
      const logoFallback = document.getElementById("brandFallback");
      if (config.brand && typeof config.brand.logo === "string" && config.brand.logo.trim()) {
        logo.src = config.brand.logo;
      }
      if (config.brand && typeof config.brand.name === "string" && config.brand.name.trim()) {
        logoFallback.textContent = config.brand.name;
      }
      logo.addEventListener("error", () => {
        logo.style.display = "none";
        logoFallback.style.display = "inline-block";
      }, { once: true });
      if (logo.complete && logo.naturalWidth === 0) {
        logo.style.display = "none";
        logoFallback.style.display = "inline-block";
      }

    })();
  </script>
  <script src="app-nav.js"></script>
</body>
</html>
