<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코웨이 홈케어 메인</title>
  <style>
    /* 전체 배경 설정 */
    body {
      background-color: #f4f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      margin: 0;
      padding-bottom: 80px; /* 하단 메뉴바에 안 가려지게 여백 확보 */
    }
    /* 상단 파란색 간판 */
    .header {
      background: #0b63ce;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 10px rgba(11, 99, 206, 0.2);
    }
    /* 하얀색 박스 (계산기 영역) */
    .card {
      background: white;
      margin: 20px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 18px;
      font-weight: 800;
      color: #333;
      margin-bottom: 20px;
    }
    /* 입력칸 디자인 */
    .input-group { margin-bottom: 15px; }
    .input-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #e4e7ec;
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }
    .input-group input:focus {
      border-color: #0b63ce;
      outline: none;
    }
    /* 계산 버튼 */
    .calc-btn {
      width: 100%;
      padding: 16px;
      background: #0b63ce;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }
    /* 최종 결과창 (처음엔 숨겨둠) */
    .result-box {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #0b63ce;
      display: none; /* 계산 버튼 누르면 짠 하고 나타남 */
    }
    .result-text { font-size: 15px; color: #666; font-weight: bold; margin-bottom: 5px; }
    .result-price { font-size: 28px; font-weight: 900; color: #e53935; }
    
    /* 하단 메뉴바 (앱 느낌) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
    .nav-item { text-align: center; color: #adb5bd; font-size: 14px; font-weight: 800; }
    .nav-item.active { color: #0b63ce; }
  </style>
</head>
<body>

  <!-- 상단 간판 -->
  <div class="header">COWAY 세일즈 웨폰</div>

  <!-- 계산기 박스 -->
  <div class="card">
    <div class="card-title">💰 현장 렌탈료 계산기</div>
    
    <div class="input-group">
      <label>기본 월 렌탈료 (원)</label>
      <input type="number" id="basePrice" placeholder="예: 39900" inputmode="numeric">
    </div>
    <div class="input-group">
      <label>제휴카드 할인 (원)</label>
      <input type="number" id="cardDiscount" placeholder="예: 13000" inputmode="numeric">
    </div>
    <div class="input-group">
      <label>프로모션 추가 할인 (원)</label>
      <input type="number" id="promoDiscount" placeholder="없으면 비워두세요" inputmode="numeric">
    </div>
    
    <button class="calc-btn" onclick="calculate()">최종 납입금 확인</button>

    <!-- 계산 결과창 -->
    <div class="result-box" id="resultBox">
      <div class="result-text">고객님 최종 월 납입금</div>
      <div class="result-price" id="finalPrice">0원</div>
    </div>
  </div>

  <!-- 하단 고정 메뉴바 -->
  <div class="bottom-nav">
    <div class="nav-item active">계산기</div>
    <div class="nav-item">B&A 갤러리</div>
    <div class="nav-item">특별뽑기</div>
    <div class="nav-item">지국공지</div>
  </div>

  <!-- 계산기 작동 원리 -->
  <script>
    function calculate() {
      // 입력칸에 적힌 숫자를 가져옴 (안 적었으면 0으로 처리)
      let base = document.getElementById('basePrice').value || 0;
      let card = document.getElementById('cardDiscount').value || 0;
      let promo = document.getElementById('promoDiscount').value || 0;

      // 렌탈료 - 카드할인 - 프로모션 = 최종 금액
      let final = parseInt(base) - parseInt(card) - parseInt(promo);
      
      // 혹시 마이너스가 나오면 0원으로 고정
      if (final < 0) final = 0;

      // 계산 결과창에 빨간색으로 예쁘게 콤마(,) 찍어서 보여줌
      document.getElementById('finalPrice').innerText = final.toLocaleString() + "원";
      
      // 숨겨져 있던 결과창을 짜잔! 하고 보여줌
      document.getElementById('resultBox').style.display = "block";
    }
  </script>

</body>
</html>
