<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코웨이 홈케어 메인</title>
  <style>
    body { background-color: #f4f7fa; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding-bottom: 80px; }
    .header { background: #0b63ce; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: 900; }
    
    /* 8칸 바둑판(그리드) 메뉴 스타일 */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
    .menu-card { background: white; border-radius: 15px; padding: 25px 10px; text-align: center; text-decoration: none; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .menu-card:active { background: #eef2f6; }
    .menu-icon { font-size: 35px; margin-bottom: 12px; }
    .menu-title { font-size: 15px; font-weight: 800; }

    /* 하단 메뉴바 */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); border-top-left-radius: 15px; border-top-right-radius: 15px;}
    .nav-item { text-align: center; color: #adb5bd; font-size: 13px; font-weight: 800; text-decoration: none; }
    .nav-item.active { color: #0b63ce; }
  </style>
</head>
<body>

  <!-- 누르면 무조건 홈으로 오게 통로 연결 -->
  <a href="main.html" style="text-decoration: none;">
    <div class="header">COWAY 세일즈 웨폰</div>
  </a>

  <!-- 8칸 메뉴판 (대시보드) -->
  <div class="dashboard-grid">
    <a href="calc.html" class="menu-card">
      <div class="menu-icon">🧮</div>
      <div class="menu-title">렌탈료 계산기</div>
    </a>
    <a href="gallery.html" class="menu-card">
      <div class="menu-icon">🖼️</div>
      <div class="menu-title">현장 B&A 갤러리</div>
    </a>
    <a href="#" class="menu-card">
      <div class="menu-icon">🎁</div>
      <div class="menu-title">이달의 프로모션</div>
    </a>
    <a href="#" class="menu-card">
      <div class="menu-icon">📇</div>
      <div class="menu-title">내 모바일 명함</div>
    </a>
    <a href="#" class="menu-card">
      <div class="menu-icon">👥</div>
      <div class="menu-title">고객 관리 장부</div>
    </a>
    <a href="#" class="menu-card">
      <div class="menu-icon">📖</div>
      <div class="menu-title">스마트 카탈로그</div>
    </a>
    <a href="#" class="menu-card">
      <div class="menu-icon">💡</div>
      <div class="menu-title">영업 노하우</div>
    </a>
    <a href="#" class="menu-card">
      <div class="menu-icon">⚙️</div>
      <div class="menu-title">준비중(빈칸)</div>
    </a>
  </div>

  <!-- 하단 고정 메뉴바 -->
  <div class="bottom-nav">
    <a href="main.html" class="nav-item active">홈(메인)</a>
    <a href="calc.html" class="nav-item">계산기</a>
    <a href="gallery.html" class="nav-item">갤러리</a>
    <a href="#" class="nav-item">프로모션</a>
  </div>

</body>
</html>
